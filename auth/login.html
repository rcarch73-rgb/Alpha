<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Harbour North - Sign In</title>
  <link rel="stylesheet" href="../app/css/auth.css">
</head>
<body class="hn-login-page">
  <main class="hn-login-shell" aria-labelledby="hnLoginTitle">
    <section class="hn-login-card">
      <div class="hn-login-brand" aria-hidden="true">Harbour North</div>
      <h1 id="hnLoginTitle">Plan your retirement with confidence.</h1>
      <p class="hn-login-copy">Sign in to continue your Harbour North plan.</p>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="signInBtn" type="submit">Sign In</button>
        <div id="status" aria-live="polite"></div>
      </form>

      <div class="hn-login-links">
        <a href="../app/#createAccount">Create an account</a>
        <a href="../app/#signIn">Need help signing in?</a>
      </div>
    </section>
    <div class="hn-login-art" aria-hidden="true"><span class="hn-beacon"></span></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../app/js/auth/supabase-client.js"></script>
  <script src="../app/js/auth/login.js"></script>
</body>
</html>
